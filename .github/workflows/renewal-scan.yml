name: Subscription renewal scan

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger renewal scan
        run: |
          curl -fsS -X POST "https://fiapp.onrender.com/internal/run-renewal-scan" \
            -H "X-Scan-Secret: $PUSH_SCAN_SECRET" \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120
        env:
          PUSH_SCAN_SECRET: ${{ secrets.PUSH_SCAN_SECRET }}
